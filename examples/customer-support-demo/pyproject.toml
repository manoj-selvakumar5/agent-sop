[project]
name = "customer-support-demo"
version = "0.1.0"
description = "Demo project showing before/after effect of Agent SOPs for customer support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.19.0",
    "strands-agents-tools>=0.2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
